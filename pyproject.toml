[project]
name = "frappe-enterprise-mcp"
version = "0.1.0"
description = "Read-only, deny-by-default local stdio MCP server for Frappe/ERPNext REST APIs."
readme = "README.md"
authors = [
    { name = "Mayureshju", email = "juvekarmayuresh37@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # mcp 2.x API (lowlevel Server, mcp.types); 3.x may break it, so cap the major.
    "mcp[cli]>=2.3.0,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
frappe-enterprise-mcp = "frappe_enterprise_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: live Frappe site tests; run with FRAPPE_INTEGRATION=1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
